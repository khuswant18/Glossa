name: Instagram

# Posts from social/posts.json at 07:00 and 19:00 IST, and today's story from social/stories.json from 13:00 IST.
# Images must already be live on the site (they're deployed with the repo).
# Runs hourly because GitHub often starts scheduled runs hours late or skips them. Each run posts only what
# is due, never twice, and keeps 5 h between feed posts, so the extra runs are harmless.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to publish'
        type: choice
        options: [post, story]
        default: post
      id:
        description: 'Post id to publish now (empty = next due post)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (check only, do not publish)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish post
        if: github.event_name == 'schedule' || inputs.mode == 'post'
        run: >
          node scripts/social-publish.mjs
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.id && format('--id={0}', inputs.id) || '' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SOCIAL_BASE_URL: https://glossa.wovenbit.tech
      - name: Publish story
        if: (github.event_name == 'schedule' && !cancelled()) || inputs.mode == 'story'
        run: node scripts/social-publish.mjs --stories ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SOCIAL_BASE_URL: https://glossa.wovenbit.tech
